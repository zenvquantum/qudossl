; SLH-DSA configuration (install as ~/.qudo/slhdsa.conf or /etc/qudo/slhdsa.conf)

[general]
verbose = 0
log_file =

[parameter_sets]
; Enable/disable specific parameter sets (1=enabled, 0=disabled)
enable_sha2_128s = 1
enable_sha2_128f = 1
enable_sha2_192s = 1
enable_sha2_192f = 1
enable_sha2_256s = 1
enable_sha2_256f = 1
enable_shake_128s = 1
enable_shake_128f = 1
enable_shake_192s = 1
enable_shake_192f = 1
enable_shake_256s = 1
enable_shake_256f = 1

[performance]
; Use hardware acceleration if available
use_avx2 = 1
use_neon = 1

[security]
; Use secure memory (mlock/VirtualLock)
secure_memory = 1
