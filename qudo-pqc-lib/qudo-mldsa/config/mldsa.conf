# ML-DSA signature configuration

[Security]
# Default parameter set: 44 (NIST Level 2), 65 (Level 3), or 87 (Level 5)
default_level = 65

# Enable/disable specific security levels
enable_44 = true
enable_65 = true
enable_87 = true

[Performance]
# Use AVX2 optimizations (x86/x64 only, auto-detected)
use_avx2 = auto

# Use NEON optimizations (ARM64 only, auto-detected)
use_neon = auto

# Maximum number of threads for parallel operations
max_threads = 4

[Algorithm]
# Use deterministic signing (same input always produces the same signature)
deterministic = false

# Enable context string support
enable_context = true

[Logging]
# Enable verbose logging
verbose = false

# Log to file
log_to_file = false

# Log file path (Linux/macOS: /var/log/mldsa/mldsa.log, Windows: C:\ProgramData\mldsa\mldsa.log)
log_file_path = /var/log/mldsa/mldsa.log
