# ML-KEM configuration

[Security]
# Default parameter set: 512 (NIST Level 1), 768 (Level 3), or 1024 (Level 5)
default_level = 768

# Enable/disable specific security levels
enable_512 = true
enable_768 = true
enable_1024 = true

[Performance]
# Use AVX2 optimizations (x86/x64 only, auto-detected)
use_avx2 = auto

# Use AES-NI instructions (auto-detected)
use_aes_ni = auto

# Maximum number of threads for parallel operations
max_threads = 4

[Logging]
# Enable verbose logging
verbose = false

# Log to file
log_to_file = false

# Log file path (Linux/macOS: /var/log/mlkem/mlkem.log, Windows: C:\ProgramData\mlkem\mlkem.log)
log_file_path = /var/log/mlkem/mlkem.log
