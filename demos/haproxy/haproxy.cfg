global
    log stdout format raw local0
    # The post-quantum line: ML-KEM hybrids first, classical curves last so
    # clients without ML-KEM still connect. HAProxy refuses to start if any
    # name in this list is unknown, so a typo fails loudly.
    ssl-default-bind-curves X25519MLKEM768:SecP256r1MLKEM768:SecP384r1MLKEM1024:secp256r1:secp384r1
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode    http
    log     global
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend https
    # Ordinary RSA certificate and key, in one PEM file.
    bind :9443 ssl crt /usr/local/etc/haproxy/certs/server.pem alpn h2,http/1.1
    # HAProxy has no sample fetch for the negotiated key-exchange group, so
    # the page reports protocol and cipher; verify.sh checks the group with
    # the QudoSSL CLI.
    http-request return status 200 content-type text/plain lf-string "Hello from HAProxy on QudoSSL\nprotocol: %[ssl_fc_protocol]\ncipher:   %[ssl_fc_cipher]\n"
