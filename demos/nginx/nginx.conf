user nobody nogroup;
worker_processes 1;

# nginx clears the environment for its workers; keep the QudoSSL settings.
env OPENSSL_CONF;
env OPENSSL_MODULES;

error_log /dev/stderr notice;

events {}

http {
    access_log /dev/stdout;

    server {
        listen 8443 ssl;
        http2  on;
        server_name localhost;

        ssl_certificate     /usr/local/nginx/certs/server.crt;  # ordinary RSA
        ssl_certificate_key /usr/local/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;  # ML-KEM requires TLS 1.3

        # The post-quantum line: ML-KEM hybrids first, classical curves last so
        # clients without ML-KEM still connect.
        ssl_conf_command Groups X25519MLKEM768:SecP256r1MLKEM768:SecP384r1MLKEM1024:secp256r1:secp384r1;

        # $ssl_curve shows the negotiated group: X25519MLKEM768 for a post-quantum
        # client, a classical curve such as prime256v1 otherwise.
        location / {
            default_type text/plain;
            return 200 "Hello from nginx on QudoSSL\nprotocol: $ssl_protocol\ncipher:   $ssl_cipher\ngroup:    $ssl_curve\n";
        }
    }
}
